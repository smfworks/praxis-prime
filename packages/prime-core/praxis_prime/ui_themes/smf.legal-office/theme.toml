schema = "praxis.theme/v1"
id = "smf.legal-office"
name = "Legal Office"
version = "1.0.0"
license = "MIT"
authors = ["Praxis Prime"]
description = "Parchment, navy, and brass. Burgundy is reserved for danger."
modes = ["light", "dark"]
default_mode = "light"
min_praxis = "0.1.0"
contrast = "AA"

[fonts.display]
family = "Libre Baskerville"
license = "OFL-1.1"
fallback = "Georgia, serif"
files = [
  { path = "assets/fonts/LibreBaskerville.woff2", weight = "400 700", style = "normal" },
]

[fonts.body]
family = "Source Sans 3"
license = "OFL-1.1"
fallback = "sans-serif"
files = [
  { path = "assets/fonts/SourceSans3.woff2", weight = "200 900", style = "normal" },
]

[fonts.mono]
family = "Source Code Pro"
license = "OFL-1.1"
fallback = "monospace"
files = [
  { path = "assets/fonts/SourceCodePro.woff2", weight = "200 900", style = "normal" },
]

[shape]
radius = 6
density = "cozy"
motion = "subtle"
scale = 1.2
baseSize = 16
lineHeight = 1.5
borderWidth = 1

[tokens.light]
bg = "#f7f3ea"
bgRaised = "#ffffff"
fg = "#1b2233"
fgMuted = "#4d5566"
accent = "#1f3a68"
accentFg = "#ffffff"
border = "#d6cfbf"
borderStrong = "#4d5566"
ring = "#1f3a68"
ok = "#2e6b3f"
warn = "#8a5a00"
danger = "#8c1c2b"

[tokens.dark]
bg = "#0f1522"
bgRaised = "#172033"
fg = "#ece6d8"
fgMuted = "#a9b0bf"
accent = "#c9a45c"
accentFg = "#0f1522"
border = "#2a3550"
borderStrong = "#a9b0bf"
ring = "#c9a45c"
ok = "#7cc48a"
warn = "#e0b04a"
danger = "#e57373"

[ornaments]
divider = "assets/ornaments/rule.svg"
