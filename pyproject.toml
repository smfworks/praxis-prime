[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "praxis-prime"
dynamic = ["version"]
description = "Local-first autonomous AI agent for Linux. Pre-alpha."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY.md"]
requires-python = ">=3.12"
authors = [{ name = "SMF Works" }]
keywords = ["agent", "linux", "local-first", "omarchy", "ubuntu"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["argon2-cffi>=23.1.0"]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.8", "hatchling>=1.26"]
browser = ["playwright>=1.48"]

[project.urls]
Homepage = "https://github.com/smfworks/praxis-prime"
Documentation = "https://github.com/smfworks/praxis-prime/blob/main/docs/ARCHITECTURE.md"
Source = "https://github.com/smfworks/praxis-prime"
Issues = "https://github.com/smfworks/praxis-prime/issues"

[project.scripts]
praxis-prime = "praxis_prime.cli:main"
pprime = "praxis_prime.cli:main"
praxis-primed = "praxis_prime.daemon:main"

[tool.hatch.version]
path = "packages/prime-core/praxis_prime/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["packages/prime-core/praxis_prime"]

# Repo-root TOML is outside the import package. Force it into the wheel so
# importlib.resources can read it after a normal install. The sdist keeps the
# same files at packs/compliance so a wheel built from the sdist still works.
[tool.hatch.build.targets.wheel.force-include]
"packs/compliance" = "praxis_prime/_data/packs/compliance"

[tool.hatch.build.targets.sdist.force-include]
"packs/compliance" = "packs/compliance"

[tool.uv]
package = true

[tool.pytest.ini_options]
pythonpath = [".", "packages/prime-core"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["packages/prime-core", "tests", "packs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
