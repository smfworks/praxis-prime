# US state starter packs for the 13 dials already in the catalog.
# Statute names are citations for the owner. The 30-day SLA is an internal
# policy choice, not a statement of each state's deadline.
# Starter policy. Not legal advice.

[[pack]]
id = "state_ct"
dial = "state_ct"
title = "Connecticut"
disclaimer = "Starter policy for Connecticut. Technical controls only. Not legal advice."
retention_days = 365

[pack.meta]
starter = true
not_legal_advice = true
legal_references = [
  "Conn. Gen. Stat. § 36a-701b (breach of security)",
  "Connecticut Data Privacy Act, Public Act 22-15",
]

[pack.audit]
required_events = ["detection", "breach", "retention", "approval"]

[pack.breach]
enabled = true
sla_days = 30
sla_is_legal_deadline = false

[[pack.detectors]]
id = "ssn"
kind = "ssn"
data_class = "US_PII"

[[pack.detectors]]
id = "named_email"
kind = "named_email"
data_class = "US_PII"

[[pack.rules]]
id = "pii-send"
action = "require_approval"
data_class = "US_PII"
hooks = ["H5"]
tools = ["telegram", "browser", "mcp", "web_fetch"]

[[pack.rules]]
id = "pii-redact"
action = "redact"
data_class = "US_PII"
hooks = ["H4", "H6"]
style = "last4"

